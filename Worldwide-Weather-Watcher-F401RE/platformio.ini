; PlatformIO Project Configuration File
; Projet Worldwide Weather Watcher - portage Nucleo F401RE

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
; analyse aussi les includes des bibliotheques (cesi_grove utilise fatfs)
lib_ldf_mode = deep+
; console de configuration : affiche ce qu'on tape, envoie la ligne a l'appui sur Entree
monitor_echo = yes
monitor_filters = send_on_enter
monitor_eol = LF
build_flags =
	-Wl,-u,_printf_float
